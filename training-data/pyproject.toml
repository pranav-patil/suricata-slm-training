[tool.poetry]
name = "slm-training-scripts"
version = "0.1.0"
description = ""
authors = ["Pranav Patil <pranav@email.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10.0, <3.11"
boto3 = ">=1.40.38"
botocore = ">=1.40.38"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
markers = [
    "aws: all tests require active AWS credentials",
    "slow: integration tests which may take a significant time to complete"
]
log_cli_date_format="%Y-%m-%d %H:%M:%S"
log_cli_level="INFO"

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
(
    /(
        \.git
      | \.mypy_cache
      | \.venv
      | _build
      | buck-out
      | build
      | dist
    )/
)
'''

[tool.isort]
profile = "black"
line_length = 88
known_third_party = ["numpy", "pandas"]

[tool.flake8]
max-line-length = 120

[dependency-groups]
dev = [
    "isort (>=6.1.0,<7.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=25.9.0,<26.0.0)",
]